<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tap Foods</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="login-container" style="max-width: 480px;">
        <h2>Create Account</h2>
        <p class="subtitle">Join Tap Foods to order your favorite meals</p>

        <form action="RegisterServlet" method="POST">
            
            <div class="input-group">
                <label for="userName">User Name</label>
                <div class="input-field">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="userName" name="userName" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
            </div>

            <div class="input-group">
                <label for="address">Delivery Address</label>
                <div class="input-field" style="height: auto;">
                    <i class="fa-solid fa-location-dot" style="margin-top: 12px;"></i>
                    <textarea id="address" name="address" rows="3" placeholder="Enter full delivery address" style="border: none; outline: none; width: 100%; font-family: inherit; padding: 10px 0;" required></textarea>
                </div>
            </div>

            <div class="input-group">
                <label for="role">Role</label>
                <div class="input-field">
                    <i class="fa-solid fa-user-tag"></i>
                    <select id="role" name="role" style="border: none; outline: none; width: 100%; background: transparent;" required>
                        <option value="Customer" selected>Customer</option>
                        <option value="Admin">Admin</option>
                        <option value="Restaurant Owner">Restaurant Owner</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-login" style="margin-top: 10px;">Register</button>
            
            <p class="signup-text">
                Already have an account? <a href="login.html">Login here</a>
            </p>

            <!-- Fixed link to point to index.jsp instead of index.html -->
            <a href="index.jsp" class="home-link"><i class="fa-solid fa-house"></i> Back to Home</a>
        </form>
    </div>

</body>
</html>
