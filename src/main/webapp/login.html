<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tap Foods</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your credentials to login</p>

        <!-- Error Alert Display -->
        <div id="error-msg" style="color: red; text-align: center; margin-bottom: 10px; display: none;"></div>

        <form action="LoginServlet" method="POST">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="enter your email" autocomplete="email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="signup-text">
            Don't have an account? <a href="register.html">Register here</a>
        </p>

        <a href="index.jsp" class="home-link"><i class="fa-solid fa-house"></i> Back to Home</a>
    </div>

    <script>
        // Display user-friendly error messages from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorDiv = document.getElementById('error-msg');

        if (error === 'userNotFound') {
            errorDiv.innerText = 'No account found with this email. Please register first.';
            errorDiv.style.display = 'block';
        } else if (error === 'invalidPassword') {
            errorDiv.innerText = 'Incorrect password. Please try again.';
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
